server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  datasource:
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  # Redis 连接池
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

# 自定义配置：JWT 密钥和文件上传路径
campus-market:
  jwt:
    secret: campus-market-secret-key-2024-change-in-production
    expiration: 604800000  # 7 天（毫秒）
  upload:
    path: ./uploads
    allowed-types: jpg,jpeg,png,gif,webp
    oss:
      endpoint:
      access-key-id:
      access-key-secret:
      bucket-name:
      domain:
      # 以上 OSS 配置请在 application-dev.yml 中填写实际值

# MyBatis-Plus 全局配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true     # 数据库下划线 ↔ Java 驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL 日志输出到控制台
  global-config:
    db-config:
      id-type: auto                         # 主键自增
      logic-delete-field: deleted           # 逻辑删除字段
