spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# OSS 配置（含敏感凭证，不要提交到 Git）
campus-market:
  upload:
    oss:
      endpoint: oss-cn-beijing.aliyuncs.com
      access-key-id: <YOUR_ACCESS_KEY_ID>
      access-key-secret: <YOUR_ACCESS_KEY_SECRET>
      bucket-name: campus-market-bucket
      domain: https://campus-market-bucket.oss-cn-beijing.aliyuncs.com

# 开发环境日志级别
logging:
  level:
    com.campusmarket: debug
